[build-system]
build-backend = "setuptools.build_meta"
requires = [
	"setuptools>=61.0",
]


[project]
authors = [
	{ email = "matthew@synesis.com.au", name = "Matt Wilson" },
]
classifiers = [
	"Intended Audience :: Developers",
	"License :: OSI Approved :: BSD License",
	"Natural Language :: English",
	"Operating System :: OS Independent",
	"Programming Language :: Python",
	"Programming Language :: Python :: 2",
	"Programming Language :: Python :: 2.7",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
]
dependencies = [
]
description = "Basic diagnostic facilities, for Python"
keywords = [
	"diagnostic",
	"diagnostics",
	"logging",
	"stopwatch",
	"trace",
	"tracing",
]
license = { text = "BSD-3-Clause" }
name = "diagnosticism"
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*, !=3.6.*, !=3.7.*"
version = "0.18.0"

[project.urls]
"Bug Tracker" = "https://github.com/synesissoftware/Diagnosticism.Python/issues"
Changelog = "https://github.com/synesissoftware/Diagnosticism.Python/blob/master/CHANGES.md"
Homepage = "https://github.com/synesissoftware/Diagnosticism.Python"
Repository = "https://github.com/synesissoftware/Diagnosticism.Python"

[project.optional-dependencies]
dev = [
	"pytest",
	"ruff>=0.4.0",
]


[tool.ruff]
line-length = 76
target-version = "py38"

[tool.ruff.lint]
ignore = [
	"E501",
]
select = [
	"E",
	"F",
]

[tool.ruff.lint.per-file-ignores]
"diagnosticism/contingent_reporting.py" = [
	"E711",
	"E712",
]
"diagnosticism/logging.py" = [
	"E712",
]
"diagnosticism/tracing.py" = [
	"E712",
]

[tool.setuptools.packages.find]
exclude = [
	"examples*",
	"tests*",
]
include = [
	"diagnosticism",
	"diagnosticism.*",
]
