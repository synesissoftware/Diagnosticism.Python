# This workflow will install Python dependencies, run tests, and smoke
# the sdist/wheel on a range of Python versions.
#
# Created: 14th September 2026
# Updated: 20th November 2026
#

name: Python package

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
    - name: Checking out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff

    - name: Lint with ruff
      run: |
        ruff check .

  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        # CPython 3.8 and 3.9 are absent from Ubuntu 26.04 and from
        # arm64 macOS. Those versions run on Ubuntu 22.04 and on
        # Windows.
        exclude:
          - os: macos-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-22.04
            python-version: "3.9"

    steps:
    - name: Checking out code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install -e .

    - name: Test with pytest
      run: |
        pytest

    - name: Build and install smoke
      run: |
        python -m pip install build
        python -m build
        python -m pip install dist/diagnosticism-*.whl
        python -c "import diagnosticism; from importlib.metadata import version; got = version('diagnosticism'); assert got == diagnosticism.__version__, got; print(got)"

  build-py27:

    runs-on: ubuntu-latest
    container:
      image: python:2.7-slim
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python -m pip install --upgrade "pip<21" setuptools mock
    - name: Compile library modules
      run: |
        python -m compileall -x '_fmt_py3' diagnosticism
    - name: Test with unittest
      run: |
        python tests/run_unittest.py
      env:
        PYTHONPATH: ${{ github.workspace }}
